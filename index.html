<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRS-CODES</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Lilita+One&family=Lobster&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Lilita+One&family=Lobster&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        :root{
            --global-bg-color: white;
            --global-fg-color: black;
            --translucent-color: rgba(255, 255, 255, 0.473);
            --dark-color: rgba(51, 51, 51, 0.966);
            --light-color: rgb(151, 151, 151);
            --yes-color: rgb(0, 209, 0);
            --yello-color: rgb(252, 211, 30);
            --beautiful-color-1: aqua;
            --beautiful-color-1-light: rgb(187, 255, 255);
            --beautiful-color-2: rgb(212, 0, 255);
            --beautiful-color-2-light: rgb(240, 163, 255);
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--global-bg-color);
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }

        nav {
            background-color: var(--translucent-color);
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 10px;
            box-shadow: 0px 8px 10px -15px var(--beautiful-color-2);    
        }

        a {
            text-decoration: none;
            color: var(--beautiful-color-2-light);
            font-weight: 700;
            font-size: 14px;
            font-family: "Raleway", sans-serif;
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .whatsapp-button, .resume {
            height: 38px;
            width: 100%;
            font-size: 16px;
            border-radius: 40px;
            padding: 0 12px;
            background-color: var(--beautiful-color-2);
            color: var(--global-bg-color);
            border: none;
            font-weight: 600;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }

        .myname {
            font-family: "Lilita One", cursive;
            font-size: 40px;
            color: var(--beautiful-color-2);
            font-weight: 700;
        }

        .myself {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            top: 20px;
            margin: 12px;
            padding: 20px;
            background-color: var(--global-bg-color);
            box-shadow: var(--beautiful-color-2-light) 0px 10px 20px, rgba(0, 0, 0, 0.23) 0px 6px 6px;
            border-radius: 30px;
            color: var(--beautiful-color-1);
        }

        .myimg {
            height: 220px;
            width: auto;
        }

        .myimage {
            height: 300px;
            width: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--yello-color);
            border-radius: 50%;
        }

        .sec {
            font-size: 43px;
            font-weight: 800;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }

        .hello {
            color: var(--beautiful-color-1);
        }

        .i-am {
            color: var(--beautiful-color-2-light);
            font-family: "Dancing Script";
        }

        .name {
            font-family: "Lilita One", cursive;
            color: var(--beautiful-color-2);
            font-weight: 500;
        }

        .profession {
            font-size: 34px;
            margin-top: 15px;
            display: flex;
            height:50px;
        }

        .animating-text {
            overflow: hidden;
        }

        .animating-text > div > div {
            height:2.81rem;
            margin-bottom: 2.81rem;
            display:inline-block;
        }

        .animating-text div:first-child {
            animation: text-animation 8s infinite;
        }

        .flutter-dev div {
            /* background-color: var(--beautiful-color-2-light); */
            color: var(--beautiful-color-1);
            font-family: "Lilita One", cursive;
            font-weight: normal;
        }

        .laravel-dev div {
            /* background-color: var(--beautiful-color-2-light); */
            color: var(--beautiful-color-2-light);
            font-family: "Lilita One", cursive;
            font-weight: normal;
        }

        .backend-dev div {
            /* background-color: var(--beautiful-color-2-light); */
            color: var(--beautiful-color-1);
            font-family: "Lilita One", cursive;
            font-weight: normal;
        }

        @keyframes text-animation {
            0% {margin-top: 0;}
            10% {margin-top: 0;}
            20% {margin-top: -5.62rem;}
            30% {margin-top: -5.62rem;}
            40% {margin-top: -11.24rem;}
            60% {margin-top: -11.24rem;}
            70% {margin-top: -5.62rem;}
            80% {margin-top: -5.62rem;}
            90% {margin-top: 0;}
            100% {margin-top: 0;}
        }



        .resume {
            width: 100px;
            font-size: 18px;
        }        


    </style>
</head>

<body>

    <nav>
        <div class="nav-name">
            <a href="#" class="myname">
                DRS-CODES
            </a>
        </div>

        <div class="nav-menu">
            <a href="#about">
                ABOUT
            </a>
            <a href="#certificates">
                CERTIFICATES
            </a>
            <a href="#projects">
                PROJECTS
            </a>
            <a href="#profiles">
                PROFILES
            </a>

            <a href="https://wa.me/1111111111" target="_blank" class="p-2">
                <button class="whatsapp-button">Contact me</button>
            </a>


        </div>
    </nav>

    <div class="myself">
        <div class="sec">
            <span class="hello">Hello</span>, <span class="i-am">I am</span>
            <div class="name">
                Dhanashree Sawant
            </div>
            <div class="profession">
                <div class="animating-text">
                    <div class="flutter-dev"><div>Flutter App Developer</div></div>
                    <div class="laravel-dev"><div>Laravel Developer</div></div>
                    <div class="backend-dev"><div>Backend Developer</div></div>
                </div>
            </div>
            <button type="button" class="resume">Resume</button>
        </div>

        <div class="myimage"><img src="images/myimg.png" alt="" srcset="" class="myimg"></div>

    </div>

    
</body>
</html>
